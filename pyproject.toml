[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-training-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["ultralytics==8.4.115", "typer>=0.12,<1", "pydantic-settings>=2.2,<3", "PyYAML>=6,<7", "Pillow>=10,<12"]

[project.scripts]
yolo-pipeline = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: requires a real Ultralytics training run"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["workspace", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
